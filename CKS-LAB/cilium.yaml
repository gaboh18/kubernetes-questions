apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: "restrict-dns"
  namespace: app
spec:
  endpointSelector:
    matchLabels:
      any:org: alliance
  egress:
  - toEndpoints:
    - matchLabels:
       "k8s:io.kubernetes.pod.namespace": kube-system
       "k8s:k8s-app": kube-dns
    toPorts:
      - ports:
         - port: "53"
           protocol: UDP
